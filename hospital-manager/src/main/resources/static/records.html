<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Records - Hospital Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="page-header">
            <div>
                <h1 class="page-title">Medical Records</h1>
                <p class="text-muted">Clinical diagnoses and prescriptions</p>
            </div>
            <button id="btn-toggle-record" class="btn btn-primary" onclick="toggleRecordForm()" style="display: none;">+ Add Medical Record</button>
        </div>

        <div id="alert-box" class="alert"></div>

        <div id="record-card" class="card" style="display: none; margin-bottom: 20px;">
            <h3 style="margin-bottom: 12px; color: #0284c7;">Create Medical Record</h3>
            <form id="record-form">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label for="rec-patient">Patient</label>
                        <select id="rec-patient" class="form-control" required>
                            <option value="">-- Choose Patient --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="rec-appointment">Associated Appointment (Optional)</label>
                        <select id="rec-appointment" class="form-control">
                            <option value="">-- None --</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="rec-diagnosis">Diagnosis</label>
                    <textarea id="rec-diagnosis" class="form-control" required placeholder="Clinical assessment and diagnosis"></textarea>
                </div>

                <div class="form-group">
                    <label for="rec-prescription">Prescription & Advice</label>
                    <textarea id="rec-prescription" class="form-control" placeholder="Medications, dosage, and instructions"></textarea>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary">Save Record</button>
                    <button type="button" class="btn btn-secondary" onclick="toggleRecordForm()">Cancel</button>
                </div>
            </form>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Patient</th>
                        <th>Doctor</th>
                        <th>Diagnosis</th>
                        <th>Prescription</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="records-tbody">
                    <tr><td colspan="6" style="text-align: center;">Loading medical records...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const user = requireAuth();

        if (user) {
            renderNavbar('records');

            if (user.role === 'DOCTOR' || user.role === 'ADMIN') {
                document.getElementById('btn-toggle-record').style.display = 'block';
                loadPatientsForSelect();
                loadAppointmentsForSelect();
            }

            loadRecords();
        }

        async function loadPatientsForSelect() {
            try {
                const response = await authFetch('/api/patients');
                if (response.ok) {
                    const patients = await response.json();
                    const select = document.getElementById('rec-patient');
                    for (const p of patients) {
                        const opt = document.createElement('option');
                        opt.value = p.id;
                        opt.textContent = '#' + p.id + ' - ' + p.fullName;
                        select.appendChild(opt);
                    }
                }
            } catch (err) {}
        }

        async function loadAppointmentsForSelect() {
            try {
                const response = await authFetch('/api/appointments');
                if (response.ok) {
                    const appts = await response.json();
                    const select = document.getElementById('rec-appointment');
                    for (const a of appts) {
                        const opt = document.createElement('option');
                        opt.value = a.id;
                        opt.textContent = '#' + a.id + ' - ' + a.patientName + ' (' + a.appointmentDate.slice(0, 10) + ')';
                        select.appendChild(opt);
                    }
                }
            } catch (err) {}
        }

        async function loadRecords() {
            try {
                const response = await authFetch('/api/records');
                if (!response.ok) {
                    const data = await response.json();
                    showAlert('alert-box', data.message || 'Failed to load records.');
                    return;
                }

                const records = await response.json();
                renderTable(records);
            } catch (err) {
                showAlert('alert-box', err.message);
            }
        }

        function renderTable(records) {
            const tbody = document.getElementById('records-tbody');
            if (records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No medical records found.</td></tr>';
                return;
            }

            let html = '';
            for (const r of records) {
                const dateStr = r.createdAt ? r.createdAt.slice(0, 10) : '-';
                html += `
                    <tr>
                        <td>${r.id}</td>
                        <td><strong>${r.patientName}</strong></td>
                        <td>${r.doctorName}</td>
                        <td>${r.diagnosis}</td>
                        <td>${r.prescription || '-'}</td>
                        <td>${dateStr}</td>
                    </tr>
                `;
            }
            tbody.innerHTML = html;
        }

        function toggleRecordForm() {
            const card = document.getElementById('record-card');
            const isVisible = card.style.display !== 'none';
            card.style.display = isVisible ? 'none' : 'block';
            if (!isVisible) {
                document.getElementById('record-form').reset();
            }
        }

        document.getElementById('record-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert('alert-box');

            const patientId = document.getElementById('rec-patient').value;
            const apptId = document.getElementById('rec-appointment').value;
            const diagnosis = document.getElementById('rec-diagnosis').value.trim();
            const prescription = document.getElementById('rec-prescription').value.trim();

            const payload = {
                patientId: parseInt(patientId, 10),
                diagnosis: diagnosis,
                prescription: prescription
            };

            if (apptId) {
                payload.appointmentId = parseInt(apptId, 10);
            }

            try {
                const response = await authFetch('/api/records', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert('alert-box', data.message || 'Failed to create record.');
                    return;
                }

                showAlert('alert-box', 'Medical record created successfully!', 'success');
                toggleRecordForm();
                loadRecords();
            } catch (err) {
                showAlert('alert-box', err.message);
            }
        });
    </script>
</body>
</html>
