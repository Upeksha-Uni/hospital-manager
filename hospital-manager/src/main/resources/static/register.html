<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Hospital Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="auth-container">
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Register a new patient or staff profile</p>

        <div id="alert-box" class="alert"></div>

        <form id="register-form">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" class="form-control" required placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" required placeholder="Enter username (e.g. PS/2022/XXX)">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="Enter password">
            </div>

            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" class="form-control">
                    <option value="PATIENT" selected>PATIENT (Public)</option>
                    <option value="DOCTOR">DOCTOR (Admin only)</option>
                    <option value="NURSE">NURSE (Admin only)</option>
                    <option value="RECEPTIONIST">RECEPTIONIST (Admin only)</option>
                    <option value="ADMIN">ADMIN (Admin only)</option>
                </select>
                <small class="text-muted">Staff roles require an authenticated administrator session.</small>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>

        <p class="mt-3 text-muted" style="text-align: center;">
            Already have an account? <a href="login.html">Login here</a>
        </p>
    </div>

    <script src="js/api.js"></script>
    <script>
        renderNavbar('register');

        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert('alert-box');

            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            const token = getToken();
            const headers = { 'Content-Type': 'application/json' };
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ fullName, username, password, role })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert('alert-box', data.message || 'Registration failed.');
                    return;
                }

                showAlert('alert-box', 'Registration successful! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (err) {
                showAlert('alert-box', 'Network error or server unreachable');
            }
        });
    </script>
</body>
</html>
