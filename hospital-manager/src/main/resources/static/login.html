<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hospital Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="auth-container">
        <h2 class="auth-title">Hospital Portal Login</h2>
        <p class="auth-subtitle">Sign in to your account</p>

        <div id="alert-box" class="alert"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" required placeholder="Enter username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <p class="mt-3 text-muted" style="text-align: center;">
            Don't have an account? <a href="register.html">Register here</a>
        </p>

        <div class="demo-box">
            <h4>Sample Login Accounts</h4>
            <ul>
                <li><strong>ADMIN:</strong> <code>admin</code> / <code>password123</code></li>
                <li><strong>DOCTOR:</strong> <code>doctor1</code> / <code>password123</code></li>
                <li><strong>PATIENT:</strong> <code>patient1</code> / <code>password123</code></li>
            </ul>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        renderNavbar('login');

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert('alert-box');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert('alert-box', data.message || 'Login failed. Please check credentials.');
                    return;
                }

                setAuth(data);
                window.location.href = 'dashboard.html';
            } catch (err) {
                showAlert('alert-box', 'Network error or server unreachable');
            }
        });
    </script>
</body>
</html>
